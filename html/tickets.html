<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>פניות ושיח יזום - מערכת ליווי</title>
  <link rel="stylesheet" href="/CSS/site.css"/>
  <link rel="stylesheet" href="/CSS/student-cases.css"/>
  <link rel="stylesheet" href="/CSS/tickets.css"/>
  <link rel="stylesheet" href="/CSS/Chatbot.css"/>
</head>
<body class="page">

  <div class="layout">
    <aside class="right-sidebar">
      <div class="brand">מערכת ליווי</div>
      <nav class="main-nav">
        <a href="/dashboard" class="nav-item" title="לא מיושם בסדנה">
          <span>דשבורד</span>
        </a>

        <a href="/student-cases" class="nav-item">
          <span>תיקי סטודנטים</span>
        </a>

        <a href="/tickets" class="nav-item active">
          <span>פניות ושיח יזום</span>
        </a>

        <a href="/adjustments" class="nav-item" title="לא מיושם בסדנה">
          <span>תגבורים והתאמות</span>
        </a>

        <a href="/progress" class="nav-item">
          <span>התקדמות ומשחוק</span>
        </a>

        <a href="/reports" class="nav-item" title="לא מיושם בסדנה">
          <span>דוחות ואחזור מידע</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="settings-link" title="לא מיושם בסדנה">הגדרות</a>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-right">
          <h1 class="page-title">פניות ושיח יזום</h1>
        </div>
        <div class="topbar-center">
          <div class="search-box">
            <input type="text" id="ticketSearch" placeholder="חיפוש סטודנט / פנייה..." />
          </div>
        </div>
        <div class="topbar-left">
          <button class="icon-btn">🔔</button>
          <div class="user-name">פולינה (רכזת)</div>
        </div>
      </header>

      <main class="content">
        <section class="filters-card">
          <div class="filters-row">
            <div class="filter-group wide">
              <label>סינון:</label>
              <input type="text" id="filterInput" placeholder="שם / נושא / סטטוס" />
            </div>
          </div>
        </section>

        <section class="table-card">
          <div class="details-header" style="display:flex; justify-content:space-between; align-items:center;">
            <h3>פניות</h3>
            <div class="direction-filters" style="display:flex; gap:8px;">
              <button class="direction-btn active" data-dir="all">הכל</button>
              <button class="direction-btn" data-dir="incoming">נכנסות</button>
              <button class="direction-btn" data-dir="outgoing">יוצאות</button>
            </div>
          </div>

          <table class="students-table">
            <thead>
              <tr>
                <th>מס'</th>
                <th>יוצר הפנייה</th>
                <th>נושא</th>
                <th>סטטוס טיפול</th>
                <th>פעולה</th>
              </tr>
            </thead>
            <tbody id="ticketsTableBody"></tbody>
          </table>

          <div class="table-footer">
            <div id="pagination" class="pagination"></div>
            <button class="primary-btn big-btn" onclick="location.href='/new-ticket'">פנייה חדשה +</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/ticket.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chatbot-widget.js"></script>

</body>
</html>
