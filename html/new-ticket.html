<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>פנייה חדשה - מערכת ליווי</title>
    <link rel="stylesheet" href="/CSS/site.css" />
    <link rel="stylesheet" href="/CSS/new-ticket.css" />
    <link rel="stylesheet" href="/CSS/Chatbot.css" />
</head>

<body class="page">

    <div class="layout">
        <aside class="right-sidebar">
            <div class="brand">מערכת ליווי</div>
            <nav class="main-nav">
                <a href="/dashboard" class="nav-item" title="לא מיושם בסדנה">
                <span>דשבורד</span>
                </a>

                <a href="/student-cases" class="nav-item">
                <span>תיקי סטודנטים</span>
                </a>

                <a href="/tickets" class="nav-item active">
                <span>פניות ושיח יזום</span>
                </a>

                <a href="/adjustments" class="nav-item" title="לא מיושם בסדנה">
                <span>תגבורים והתאמות</span>
                </a>

                <a href="/progress" class="nav-item">
                <span>התקדמות ומשחוק</span>
                </a>

                <a href="/reports" class="nav-item" title="לא מיושם בסדנה">
                <span>דוחות ואחזור מידע</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="settings-link" title="לא מיושם בסדנה">הגדרות</a>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div class="topbar-right">
                    <h1 class="page-title">פנייה חדשה</h1>
                </div>
                <div class="topbar-center">
                </div>
                <div class="topbar-left">
                    <button class="icon-btn">🔔</button>
                    <div class="user-name">פולינה (רכזת)</div>
                </div>
            </header>

            <main class="content">
                <div class="form-container table-card">
                    <div class="form-header">
                        <button class="back-btn" onclick="history.back()">&#10094;</button>
                        <h2>פנייה חדשה</h2>
                    </div>

                    <form id="newTicketForm" novalidate>

                        <!-- סוג פנייה: סטודנט יחיד / תפוצה -->
                        <div class="form-group">
                            <label>סוג פנייה <span style="color:#e03131;">*</span></label>
                            <div class="mode-toggle" style="display:flex; gap:24px; align-items:center; flex-wrap:wrap;">
                                <label style="display:flex; align-items:center; gap:6px; font-weight:normal; cursor:pointer;">
                                    <input type="radio" name="ticketMode" value="single" checked
                                        style="width:16px; height:16px; margin:0; flex:none;" />
                                    פנייה לסטודנט יחיד
                                </label>
                                <label style="display:flex; align-items:center; gap:6px; font-weight:normal; cursor:pointer;">
                                    <input type="radio" name="ticketMode" value="broadcast"
                                        style="width:16px; height:16px; margin:0; flex:none;" />
                                    מייל תפוצה לכל הסטודנטים
                                </label>
                            </div>
                        </div>

                        <!-- שם ואימייל סטודנט (פנייה לסטודנט יחיד) -->
                        <div class="form-row" id="singleStudentFields">
                            <div class="form-group">
                                <label for="studentName">שם סטודנט <span style="color:#e03131;">*</span></label>
                                <input type="text" id="studentName" name="studentName"
                                    list="studentNameList" autocomplete="off"
                                    placeholder="הקלד/י שם סטודנט" />
                                <datalist id="studentNameList"></datalist>
                                <span class="field-error" id="studentNameError"></span>
                            </div>

                            <div class="form-group">
                                <label for="studentEmail">מייל סטודנט <span style="color:#e03131;">*</span></label>
                                <input type="email" id="studentEmail" name="studentEmail"
                                    list="studentEmailList" autocomplete="off"
                                    placeholder="הקלד/י מייל סטודנט" dir="ltr" />
                                <datalist id="studentEmailList"></datalist>
                                <span class="field-error" id="studentEmailError"></span>
                            </div>
                        </div>

                        <!-- מידע על נמעני התפוצה (מייל תפוצה) -->
                        <div class="form-group" id="broadcastInfo" style="display:none;">
                            <div class="broadcast-banner"
                                style="background:#e7f5ff; border:1px solid #a5d8ff; border-radius:8px; padding:12px 14px; color:#1864ab;">
                                ההודעה תישלח לכל הסטודנטים שיש להם תיק ליווי במערכת.
                                <div style="margin-top:6px;">
                                    מספר נמענים: <strong id="recipientCount">0</strong>
                                </div>
                            </div>
                        </div>

                        <!-- נמען והעתק -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cc">העתק</label>
                                <div class="cc-autocomplete">
                                    <input type="text" id="cc" name="cc" dir="ltr" autocomplete="off"
                                        placeholder="כתובות מייל נוספות, מופרדות בפסיקים" />
                                    <div id="ccSuggestions" class="cc-suggestions"></div>
                                </div>
                                <span class="field-error" id="ccError"></span>
                            </div>
                        </div>

                        <!-- נושא -->
                        <div class="form-group">
                            <label for="subject">נושא <span style="color:#e03131;">*</span></label>
                            <input type="text" id="subject" name="subject" placeholder="נושא הפנייה" />
                            <span class="field-error" id="subjectError"></span>
                        </div>

                        <!-- תוכן הפנייה עם סרגל עריכה -->
                        <div class="form-group">
                            <label>תוכן הפנייה <span style="color:#e03131;">*</span></label>
                            <div class="editor-container">
                                <div class="editor-toolbar">
                                    <button type="button" title="צירוף קובץ">📎</button>
                                    <button type="button" data-action="bold" style="font-weight:bold;" title="מודגש (Bold)">B</button>
                                    <button type="button" data-action="italic" style="font-style:italic;" title="נטוי (Italic)">I</button>
                                    <button type="button" data-action="underline" style="text-decoration:underline;" title="קו תחתון (Underline)">U</button>
                                    <button type="button">≡</button>
                                </div>
                                <textarea id="ticketContent" name="content"
                                    placeholder="הקלד כאן את תוכן הפנייה..."></textarea>
                            </div>
                            <span class="field-error" id="contentError"></span>
                        </div>

                        <div class="form-footer">
                            <button type="submit" class="primary-btn submit-btn">שליחת פנייה</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/new-ticket.js"></script>
    <script src="/js/auth.js"></script>
  <script src="/js/chatbot-widget.js"></script>
</body>

</html>
