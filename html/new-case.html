<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פתיחת תיק חדש - מערכת ליווי</title>
  <link rel="stylesheet" href="/CSS/site.css" />
  <link rel="stylesheet" href="/CSS/new-case.css" />
  <link rel="stylesheet" href="/CSS/Chatbot.css" />
</head>

<body class="page">
  <div class="layout">

    <aside class="right-sidebar">
      <div class="brand">מערכת ליווי</div>

      <nav class="main-nav">
        <a href="/dashboard" class="nav-item" title="לא מיושם בסדנה">
          <span>דשבורד</span>
        </a>

        <a href="/student-cases" class="nav-item active">
          <span>תיקי סטודנטים</span>
        </a>

        <a href="/tickets" class="nav-item">
          <span>פניות ושיח יזום</span>
        </a>

        <a href="/adjustments" class="nav-item" title="לא מיושם בסדנה">
          <span>תגבורים והתאמות</span>
        </a>

        <a href="/progress" class="nav-item">
          <span>התקדמות ומשחוק</span>
        </a>

        <a href="/reports" class="nav-item" title="לא מיושם בסדנה">
          <span>דוחות ואחזור מידע</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="settings-link" title="לא מיושם בסדנה">הגדרות</a>
      </div>
    </aside>

    <div class="main-area">

      <header class="topbar">
        <div class="topbar-right">
          <h1 class="page-title">פתיחת תיק חדש</h1>
        </div>

        <div class="topbar-center">
        </div>

        <div class="topbar-left">
          <button class="icon-btn" type="button">🔔</button>
          <div class="user-name">פולינה (רכזת)</div>
        </div>
      </header>

      <main class="content">
        <form id="newCaseForm" class="new-case-card" novalidate>
          <h3>פרטי סטודנט</h3>

          <div class="new-case-grid">
            <div class="field">
              <label for="first_name">שם פרטי <span style="color:#e03131;">*</span></label>
              <input id="first_name" required />
              <span class="field-error" id="firstNameError"></span>
            </div>

            <div class="field">
              <label for="last_name">שם משפחה <span style="color:#e03131;">*</span></label>
              <input id="last_name" required />
              <span class="field-error" id="lastNameError"></span>
            </div>

            <div class="field">
              <label for="academic_year">שנה</label>
              <input id="academic_year" placeholder="שנה א / ב / ג" />
            </div>

            <div class="field">
              <label for="email">אימייל</label>
              <input id="email" type="email" dir="ltr" placeholder="example@mail.com" />
            </div>

            <div class="field">
              <label for="phone">טלפון</label>
              <input id="phone" placeholder="0501234567" dir="ltr" />
              <span class="field-error" id="phoneError"></span>
            </div>

            <div class="field">
              <label for="status">סטטוס ליווי</label>
              <select id="status">
                <option value="Open">פתוח</option>
                <option value="Pending">מושהה</option>
                <option value="Closed">סגור</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn" onclick="window.location.href='/student-cases'">ביטול</button>
            <button type="submit" class="primary-btn">שמירה ופתיחת תיק</button>
          </div>
        </form>
      </main>

    </div>
  </div>

  <script src="/js/new-case.js"></script>
  <script src="/js/chatbot-widget.js"></script>
</body>
</html>
