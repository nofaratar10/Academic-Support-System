<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כניסה למערכת - מערכת ליווי</title>
  <link rel="stylesheet" href="/CSS/login.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <!-- לוגו וכותרת -->
      <div class="login-brand">
        <div class="login-logo">🎓</div>
        <h1 class="login-title">מערכת ליווי</h1>
        <p class="login-subtitle">האקדמית תל אביב-יפו</p>
      </div>

      <div class="login-welcome">
        <h2>ברוך הבא 👋</h2>
        <p>התחבר כדי להמשיך</p>
      </div>

      <!-- טאבים -->
      <div class="login-tabs" role="tablist">
        <button class="login-tab" data-role="student" type="button">סטודנט</button>
        <button class="login-tab" data-role="guide" type="button">מלווה</button>
        <button class="login-tab active" data-role="coordinator" type="button">רכזת</button>
      </div>

      <!-- טופס -->
      <form class="login-form" id="loginForm" novalidate>

        <div class="form-group">
          <label for="emailInput">כתובת מייל</label>
          <input
            type="email"
            id="emailInput"
            placeholder="example@campus.ac.il"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="passwordInput">סיסמה</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="passwordInput"
              placeholder="הזן סיסמה"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" id="togglePassword" tabindex="-1" aria-label="הצג/הסתר סיסמה">👁</button>
          </div>
        </div>

        <div class="login-meta">
          <a href="#" class="forgot-link">שכחת סיסמה?</a>
        </div>

        <div class="login-error hidden" id="loginError">
          אימייל או סיסמה שגויים. נסה שוב.
        </div>

        <button type="submit" class="btn-login" id="loginBtn">כניסה למערכת</button>

      </form>

      <!-- מפריד -->
      <div class="login-divider">
        <span>או</span>
      </div>

      <!-- SSO -->
      <button type="button" class="btn-sso" id="ssoBtn">
        <span class="sso-icon">🏛</span>
        כניסה עם חשבון מכללתי (SSO)
      </button>

      <!-- הערת גישה -->
      <p class="login-notice">גישה מוגבלת לאנשי סגל וסטודנטים רשומים בלבד</p>

    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
